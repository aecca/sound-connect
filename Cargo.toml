[workspace]
resolver = "3"
members = ["crates/core", "crates/bluetooth", "crates/app", "crates/ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aecca/sound-connect"

[workspace.dependencies]
sc-core = { path = "crates/core" }
sc-bluetooth = { path = "crates/bluetooth" }
async-channel = "2"
