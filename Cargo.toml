[workspace]
resolver = "3"
members = ["crates/protocol", "crates/bluetooth", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aecca/sound-connect"

[workspace.dependencies]
sc-protocol = { path = "crates/protocol" }
sc-bluetooth = { path = "crates/bluetooth" }
async-channel = "2"
