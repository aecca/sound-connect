[package]
name = "sc-ffi"
description = "Swift bindings for the Sound Connect protocol core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sound_connect_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
sc-protocol.workspace = true
uniffi = { version = "0.32", features = ["cli"] }
